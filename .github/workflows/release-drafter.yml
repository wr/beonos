# Keeps a draft release up to date with every merge to main, then empties its
# assets so the Build workflow can attach a fresh build.
#
# Versions are YYYY.M.N (2026.11.1, 2026.11.2, 2026.12.1), matching this
# repo's earlier releases, so the version step is written out here instead of
# calling esphome/workflows' draft-calver-release.yml, which names them
# YY.M.N.
#
# Adapted from esphome/workflows draft-calver-release.yml
# (https://github.com/esphome/workflows), Apache License 2.0.
# SPDX-License-Identifier: GPL-3.0-or-later
name: Release Drafter

on:
  push:
    branches:
      - main

permissions:
  contents: write  # create/update the draft release
  pull-requests: read  # categorize merged pull requests

concurrency:
  group: release-drafter
  cancel-in-progress: false

jobs:
  release-drafter:
    name: Update draft release
    runs-on: ubuntu-latest
    steps:
      - name: Calculate version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          #   YYYY = year (2026)
          #   M    = month, no zero padding (November -> 11)
          #   N    = release of that month, starting at 1
          prefix="$(date -u +%Y).$(date -u +%-m)."

          # The newest 100 releases always include everything tagged this
          # month, so one page is enough to find the highest number.
          if ! releases=$(gh api "repos/${GH_REPO}/releases?per_page=100"); then
            echo "::error::Failed to list releases"
            exit 1
          fi

          # Highest existing tag (draft or published) matching YYYY.M.*
          latest_seq=$(jq -r --arg prefix "${prefix}" \
            '[.[] | select(.tag_name | startswith($prefix))
              | .tag_name | ltrimstr($prefix) | tonumber?] | max // 0' \
            <<< "${releases}")

          if [[ "${latest_seq}" -eq 0 ]]; then
            seq=1
          else
            # Keep updating the same draft until it's published.
            is_draft=$(jq -r --arg tag "${prefix}${latest_seq}" \
              '[.[] | select(.tag_name == $tag)] | first | .draft' <<< "${releases}")
            if [[ "${is_draft}" == "true" ]]; then
              seq=${latest_seq}
            else
              seq=$((latest_seq + 1))
            fi
          fi

          version="${prefix}${seq}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Version: ${version}"

      - uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9  # v7.7.0
        id: drafter
        with:
          version: ${{ steps.version.outputs.version }}
          tag: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # release-drafter has just rewritten the body, which re-adds its
      # "assets pending" warning, so make that true: delete whatever an
      # earlier build of this draft attached. Only drafts are touched.
      - name: Delete stale assets from the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.drafter.outputs.id }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_ID}" ]]; then
            echo "::error::release-drafter did not report a release id"
            exit 1
          fi
          if ! release=$(gh api "repos/${GH_REPO}/releases/${RELEASE_ID}"); then
            echo "::error::Failed to fetch release ${RELEASE_ID}"
            exit 1
          fi
          if [[ "$(jq -r '.draft' <<< "${release}")" != "true" ]]; then
            echo "::error::Release ${RELEASE_ID} is not a draft; refusing to delete its assets"
            exit 1
          fi
          if ! asset_ids=$(gh api "repos/${GH_REPO}/releases/${RELEASE_ID}/assets" \
              --paginate --jq '.[].id'); then
            echo "::error::Failed to list assets for release ${RELEASE_ID}"
            exit 1
          fi
          if [[ -z "${asset_ids}" ]]; then
            echo "Draft release ${RELEASE_ID} has no assets to delete"
            exit 0
          fi
          while read -r id; do
            echo "Deleting asset ${id}"
            gh api "repos/${GH_REPO}/releases/assets/${id}" --method DELETE --silent
          done <<< "${asset_ids}"
