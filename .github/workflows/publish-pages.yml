# Publishes the firmware site at https://wr.github.io/beonos/. Every board
# checks firmware/beonos.manifest.json there for updates, so this runs after
# each Release, and whenever the site's own files change.
#
# The firmware comes from the newest published release that has a manifest,
# not from whatever GitHub marks as "latest": a later hardware-only release
# must not take the update file away from boards.
#
# Adapted from esphome/esphome-project-template
# (https://github.com/esphome/esphome-project-template), Apache License 2.0.
# SPDX-License-Identifier: GPL-3.0-or-later
name: Publish Pages

on:
  push:
    branches:
      - main
    paths:
      - 'static/**'
      - '.github/workflows/publish-pages.yml'
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  pull_request:
    paths:
      - 'static/**'
      - '.github/workflows/publish-pages.yml'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    # Skip if the Release run that triggered us failed; other events always run.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read  # actions/checkout and gh release download
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - run: mkdir -p output/firmware

      - name: Build
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697  # v1.0.13
        with:
          source: ./static
          destination: ./output

      - name: Fetch firmware files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! releases=$(gh api "repos/${GH_REPO}/releases?per_page=100"); then
            echo "::error::Failed to list releases"
            exit 1
          fi
          tag=$(jq -r '[.[] | select(.draft == false and .prerelease == false
                          and any(.assets[]; .name | endswith(".manifest.json")))]
                        | sort_by(.published_at) | last | .tag_name // ""' <<< "${releases}")
          if [[ -z "${tag}" ]]; then
            # Before the first firmware release the site goes up without it.
            echo "::warning::No published release has a firmware manifest yet"
            exit 0
          fi
          echo "Firmware from ${tag}"
          gh release download "${tag}" --dir output/firmware \
            --pattern '*.manifest.json' --pattern '*.bin'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: output
          retention-days: 1

  publish:
    if: github.event_name != 'pull_request'
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
