# Beonos: the firmware every pre-soldered kit ships with.
#
# Everything the board does lives in beonos.yaml. This file adds what a
# shipped board needs on top: Wi-Fi setup over USB, firmware updates from
# GitHub releases, and a Reset button.
#
# There's no Wi-Fi setup over Bluetooth: ESPHome's Bluetooth stack takes
# about 30% of the firmware's space and would leave no room for updates to
# grow. The "Beonos Setup" network works from any phone.
#
# SPDX-License-Identifier: GPL-3.0-or-later

packages:
  core: !include beonos.yaml

substitutions:
  # Build the beonos component from this repo, not from GitHub.
  beonos_components: components

esphome:
  project:
    name: wellsworkshop.beonos
    # Replaced with the release version by the GitHub build.
    version: dev

# Lets Home Assistant's ESPHome add-on adopt the board. Adopted boards update
# through the add-on instead of from GitHub.
dashboard_import:
  package_import_url: github://wr/beonos/beonos.yaml@main
  import_full_config: false

# Wi-Fi setup from a computer over USB (for example from web.esphome.io).
improv_serial:

# Firmware updates from GitHub releases.
http_request:

ota:
  - platform: http_request

update:
  - platform: http_request
    id: firmware
    name: Firmware
    source: https://wr.github.io/beonos/firmware/beonos.manifest.json
    update_interval: 6h

switch:
  - platform: template
    id: auto_update
    name: "Install updates automatically"
    icon: mdi:update
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

beonos:
  # The setup page's "Install updates automatically" checkbox sets this.
  auto_update_switch: auto_update

button:
  # Wipes Wi-Fi, the chosen speaker and settings, and goes back to setup.
  - platform: factory_reset
    name: Reset
    entity_category: config

interval:
  # Install updates by themselves, but never while a record could be playing.
  - interval: 5min
    then:
      - if:
          condition:
            and:
              - switch.is_on: auto_update
              - lambda: "return id(firmware).state == update::UPDATE_STATE_AVAILABLE;"
              - binary_sensor.is_off: turntable_on
              - binary_sensor.is_off: turntable_playing
          then:
            - logger.log:
                format: "Installing firmware update (turntable is off)"
                level: INFO
            - update.perform: firmware
